  function copyToClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); }); }
    else { fallbackCopy(text); }
  }
  function fallbackCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
    } catch(e){}
  }
  function downloadBlob(content, filename, mime){
    var blob = new Blob([content], {type:mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function exportJSON(){
    var data = { settings:state.settings, transactions:state.transactions, budgets:state.budgets, goals:state.goals,
      settlements: Object.keys(state.settlements).map(function(k){return state.settlements[k];}), exportadoEm:new Date().toISOString() };
    downloadBlob(JSON.stringify(data,null,2), 'livro-caixa-a-dois.json', 'application/json');
  }
  function exportCSV(){
    var rows = [['data','tipo','categoria','divisao','valor','quem','descricao']];
    state.transactions.slice().sort(function(a,b){return String(a.data).localeCompare(String(b.data));}).forEach(function(t){
      rows.push([t.data, t.tipo, catById(t.categoria,t.tipo).label, t.divisao||'', String(t.valor).replace('.',','), t.quem, (t.descricao||'').replace(/[\r\n;]/g,' ')]);
    });
    var csv = rows.map(function(r){return r.map(function(f){return '"'+String(f).replace(/"/g,'""')+'"';}).join(';');}).join('\n');
    downloadBlob('\uFEFF'+csv, 'lancamentos-livro-caixa.csv', 'text/csv;charset=utf-8');
  }
  function importJSON(){
    var input = document.getElementById('import-file');
    if (!input || !input.files || !input.files[0]){ showToast('Escolha um arquivo .json primeiro'); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = JSON.parse(e.target.result);
        var jobs = [];
        if (data.settings){ state.settings = data.settings; jobs.push(saveHouseholdMeta()); }
        if (Array.isArray(data.transactions)) jobs.push(replaceAllTransactions(data.transactions));
        if (data.budgets){ state.budgets = data.budgets; jobs.push(saveHouseholdMeta()); }
        if (Array.isArray(data.goals)) jobs.push(replaceAllGoals(data.goals));
        if (Array.isArray(data.settlements)) jobs.push(replaceAllSettlements(data.settlements));
        Promise.all(jobs).then(function(){ showToast('Dados importados'); render(); });
      } catch(err){ showToast('Arquivo inválido. Exporte um .json deste mesmo painel.'); }
    };
    reader.readAsText(input.files[0]);
  }
  function resetAllData(){
    Promise.all([ deleteAllInCollection('transactions'), deleteAllInCollection('goals'), deleteAllInCollection('settlements') ]).then(function(){
      if (isDemo()){ state.transactions=[]; state.goals=[]; state.settlements={}; }
      state.budgets = {};
      return saveHouseholdMeta();
    }).then(function(){ showToast('Todos os dados foram apagados'); render(); });
  }

  /* ================= EVENTS ================= */
  document.addEventListener('click', function(e){
    var overlay = e.target.closest('.overlay');
    if (overlay && e.target===overlay){
      var action = overlay.getAttribute('data-action');
      if (action==='overlay-close'){ state.ui.modal=null; render(); return; }
      if (action==='cancel-confirm'){ state.ui.confirm=null; render(); return; }
    }
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');

    switch(action){
      case 'generate-code':
        var ci = document.getElementById('ob-household'); if (ci) ci.value = genHouseholdCode();
        break;
      case 'connect-cloud':
        var cfgRaw = (document.getElementById('ob-config').value||'').trim();
        var hid = (document.getElementById('ob-household').value||'').trim().toUpperCase();
        var cfgObj = parseFlexibleConfig(cfgRaw);
        if (!cfgObj){ state.cloud.error='Não consegui ler essa configuração. Cole o trecho que o Firebase mostrou — pode incluir import e comentários.'; render(); break; }
        if (!cfgObj.apiKey || !cfgObj.projectId){ state.cloud.error='Faltam campos na configuração (apiKey, projectId, appId…). Cole o trecho completo.'; render(); break; }
        if (!hid){ state.cloud.error='Informe ou gere um código da casa.'; render(); break; }
        connectCloud(cfgObj, hid);
        break;
      case 'start-demo':
        startDemo();
        break;
      case 'set-tab':
        state.ui.tab = btn.getAttribute('data-tab'); render();
        break;
      case 'prev-month':
        state.ui.month--; if(state.ui.month<0){state.ui.month=11; state.ui.year--;} render();
        break;
      case 'next-month':
        state.ui.month++; if(state.ui.month>11){state.ui.month=0; state.ui.year++;} render();
        break;
      case 'open-add-transaction': openAddTransaction(); break;
      case 'edit-transaction': state.ui.modal={type:'transaction', editingId:btn.getAttribute('data-id')}; render(); break;
      case 'delete-transaction': deleteTransaction(btn.getAttribute('data-id')); break;
      case 'modal-set-tipo':
        state.ui.modal.tipo = btn.getAttribute('data-tipo');
        state.ui.modal.categoria = btn.getAttribute('data-tipo')==='receita' ? 'salario' : 'alimentacao';
        state.ui.modal.valor = document.getElementById('field-valor') ? document.getElementById('field-valor').value : state.ui.modal.valor;
        state.ui.modal.data = document.getElementById('field-data') ? document.getElementById('field-data').value : state.ui.modal.data;
        state.ui.modal.quem = document.getElementById('field-quem') ? document.getElementById('field-quem').value : state.ui.modal.quem;
        state.ui.modal.descricao = document.getElementById('field-descricao') ? document.getElementById('field-descricao').value : state.ui.modal.descricao;
        state.ui.modal.__noAnim = true;
        render();
        break;
      case 'modal-set-divisao':
        state.ui.modal.divisao = btn.getAttribute('data-divisao');
        state.ui.modal.valor = document.getElementById('field-valor') ? document.getElementById('field-valor').value : state.ui.modal.valor;
        state.ui.modal.categoria = document.getElementById('field-categoria') ? document.getElementById('field-categoria').value : state.ui.modal.categoria;
        state.ui.modal.data = document.getElementById('field-data') ? document.getElementById('field-data').value : state.ui.modal.data;
        state.ui.modal.quem = document.getElementById('field-quem') ? document.getElementById('field-quem').value : state.ui.modal.quem;
        state.ui.modal.descricao = document.getElementById('field-descricao') ? document.getElementById('field-descricao').value : state.ui.modal.descricao;
        state.ui.modal.__noAnim = true;
        render();
        break;
      case 'save-transaction': saveTransactionFromModal(btn.getAttribute('data-editing')||null); break;
      case 'close-modal': closeModal(); break;
      case 'open-add-goal': openAddGoal(); break;
      case 'edit-goal': openEditGoal(btn.getAttribute('data-id')); break;
      case 'save-goal': saveGoalFromModal(btn.getAttribute('data-editing')||null); break;
      case 'confirm-delete-goal':
        state.ui.confirm = { message:'Excluir esta meta? Os aportes já registrados continuam no histórico de lançamentos.', action:'delete-goal', payload:btn.getAttribute('data-id') };
        render();
        break;
      case 'open-add-aporte': openAddAporte(btn.getAttribute('data-id')); break;
      case 'save-aporte': saveAporte(btn.getAttribute('data-id')); break;
      case 'open-settlement': state.ui.modal = { type:'settlement', decisao:'pago' }; render(); break;
      case 'modal-set-decisao':
        state.ui.modal.decisao = btn.getAttribute('data-decisao');
        state.ui.modal.observacao = document.getElementById('field-settlement-obs') ? document.getElementById('field-settlement-obs').value : state.ui.modal.observacao;
        state.ui.modal.__noAnim = true;
        render();
        break;
      case 'save-settlement': saveSettlementFromModal(); break;
      case 'confirm-remove-settlement':
        state.ui.confirm = { message:'Remover este registro de acerto? A situação volta a ser calculada normalmente pelos lançamentos do mês.', action:'remove-settlement', payload:btn.getAttribute('data-mesano') };
        render();
        break;
      case 'set-pessoa': state.ui.pessoaSel = parseInt(btn.getAttribute('data-pessoa'),10); render(); break;
      case 'save-settings': saveSettingsFromForm(); break;
      case 'export-json': exportJSON(); break;
      case 'export-csv': exportCSV(); break;
      case 'import-json': importJSON(); break;
      case 'copy-household-code': copyToClipboard(cloud.householdId||''); showToast('Código copiado'); break;
      case 'confirm-disconnect':
        state.ui.confirm = { message:'Desconectar este aparelho? Você vai precisar colar a configuração e o código da casa de novo.', action:'disconnect' };
        render();
        break;
      case 'confirm-reset':
        state.ui.confirm = { message:'Apagar todos os lançamentos, orçamentos e metas? Essa ação não pode ser desfeita.', action:'reset-all' };
        render();
        break;
      case 'cancel-confirm': state.ui.confirm=null; render(); break;
      case 'run-confirm':
        var c = state.ui.confirm; state.ui.confirm=null;
        if (!c) break;
        if (c.action==='delete-goal') deleteGoal(c.payload);
        else if (c.action==='reset-all') resetAllData();
        else if (c.action==='disconnect') disconnectCloud();
        else if (c.action==='remove-settlement') removeSettlement(c.payload);
        break;
    }
  });
  document.addEventListener('change', function(e){
    if (e.target.matches('[data-filter]')){
      state.ui.filters[e.target.getAttribute('data-filter')] = e.target.value; render();
    }
    if (e.target.matches('[data-budget-cat]')){
      updateBudget(e.target.getAttribute('data-budget-cat'), e.target.value);
    }
  });
  document.addEventListener('keydown', function(e){
    if (e.key==='Escape' && (state.ui.modal || state.ui.confirm)){ state.ui.modal=null; state.ui.confirm=null; render(); }
  });
  window.addEventListener('resize', function(){
    var m = window.innerWidth < 900;
    if (m !== state.isMobile){ state.isMobile = m; render(); }
  });

  /* ================= INIT ================= */
  render();
  var savedSetup = getLocalCloudSetup();
  if (savedSetup){ connectCloud(savedSetup.config, savedSetup.householdId); }

})();
</script>
</body>
</html>
