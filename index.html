<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Livro-Caixa a Dois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3EEE1;
    --surface:#FFFFFF;
    --surface-alt:#EAE2CE;
    --ink:#2B2820;
    --ink-soft:#6B6452;
    --ink-faint:#9C9480;
    --gold:#C08A34;
    --gold-deep:#93681F;
    --gold-bg:#F3E4C4;
    --wine:#B2603E;
    --wine-deep:#8A4530;
    --wine-bg:#F1DDD1;
    --moss:#3F6B47;
    --moss-deep:#2C4E32;
    --moss-bg:#DCE7D8;
    --line:#DED2B4;
    --radius-s:10px;
    --radius-m:16px;
    --radius-l:24px;
    --shadow-card:0 1px 2px rgba(58,46,20,0.07), 0 10px 28px rgba(58,46,20,0.09);
    --shadow-float:0 8px 16px rgba(58,46,20,0.14), 0 2px 6px rgba(58,46,20,0.12);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--gold-bg);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- App shell ---------- */
  #app{min-height:100vh; display:flex; flex-direction:column;}
  .shell{
    display:flex;
    flex-direction:column;
    max-width:1180px;
    margin:0 auto;
    width:100%;
    min-height:100vh;
  }
  .shell-body{
    display:flex;
    flex:1;
    width:100%;
  }
  .main{
    flex:1;
    min-width:0;
    padding:20px 16px 100px;
  }
  @media (min-width:900px){
    .main{padding:32px 40px 48px;}
  }

  /* ---------- Header ---------- */
  .topbar{
    padding:18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  @media (min-width:900px){
    .topbar{padding:32px 40px 0;}
  }
  .brand-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .brand{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    letter-spacing:-0.01em;
    margin:0;
  }
  .brand small{
    display:block;
    font-family:var(--font-body);
    font-weight:500;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-top:2px;
  }
  .sync-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:transparent;
    border:1px solid var(--line);
    border-radius:100px;
    padding:6px 12px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .sync-btn:hover{border-color:var(--ink-faint);}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--moss);flex:none;}

  .month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .month-nav button{
    width:40px;height:40px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
    font-size:15px;
    flex:none;
  }
  .month-nav button:hover{background:var(--surface-alt);}
  .month-label{
    font-family:var(--font-display);
    font-weight:500;
    font-size:16px;
    min-width:150px;
    text-align:center;
    text-transform:capitalize;
  }

  /* ---------- Seal / ring ---------- */
  .seal-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
    padding:8px 0 4px;
  }
  .seal{position:relative; width:172px; height:172px; flex:none;}
  .seal::before{
    content:'';
    position:absolute;
    inset:-22px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(192,138,52,0.22) 0%, rgba(63,107,71,0.14) 45%, rgba(63,107,71,0) 72%);
    filter:blur(6px);
    z-index:0;
  }
  .seal svg{position:relative; z-index:1; width:100%;height:100%;transform:rotate(-90deg);}
  .seal-center{
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  .seal-value{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    letter-spacing:-0.01em;
  }
  .seal-value.neg{color:var(--wine-deep);}
  .seal-value.pos{color:var(--ink);}
  .seal-caption{
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-top:4px;
  }
  .seal-warn{
    font-size:10px;
    color:var(--wine-deep);
    margin-top:3px;
    max-width:110px;
    line-height:1.3;
  }
  .stat-mini-col{display:flex; flex-direction:column; gap:10px; min-width:150px;}
  .stat-mini{
    display:flex; align-items:center; gap:9px;
  }
  .stat-mini .dot{width:9px;height:9px;border-radius:2px;flex:none;}
  .stat-mini .dot.gold{background:var(--gold);}
  .stat-mini .dot.wine{background:var(--wine);}
  .stat-mini .txt{display:flex; flex-direction:column;}
  .stat-mini .lbl{font-size:11px; color:var(--ink-soft);}
  .stat-mini .val{font-family:var(--font-mono); font-weight:500; font-size:15px;}

  /* ---------- Nav ---------- */
  .nav-desktop{
    display:none;
  }
  @media (min-width:900px){
    .nav-desktop{
      display:flex;
      flex-direction:column;
      width:220px;
      flex:none;
      padding:32px 16px;
      gap:2px;
    }
  }
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 14px;
    border-radius:var(--radius-s);
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    background:transparent;
    border:none;
    text-align:left;
    width:100%;
    transition:background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }
  .nav-item svg{width:18px;height:18px; flex:none; transition:transform 0.15s ease;}
  .nav-item.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-card);}
  .nav-item:hover:not(.active){background:var(--surface-alt);}
  .nav-mobile .nav-item.active svg{transform:translateY(-1px);}

  .nav-mobile{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index:40;
  }
  @media (min-width:900px){ .nav-mobile{display:none;} }
  .nav-mobile .nav-item{
    flex-direction:column;
    gap:3px;
    align-items:center;
    font-size:10.5px;
    padding:6px 2px;
    flex:1;
  }
  .nav-mobile .nav-item.active{background:transparent; color:var(--gold-deep);}
  .nav-mobile .nav-item.active svg{color:var(--gold-deep);}

  .fab{
    position:fixed;
    right:18px;
    bottom:78px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--ink);
    color:#fff;
    border:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-float);
    z-index:41;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .fab svg{width:24px;height:24px;}
  @media (min-width:900px){
    .fab{bottom:32px; right:40px;}
  }
  .fab:active{transform:scale(0.93); box-shadow:0 4px 10px rgba(58,46,20,0.16);}

  /* ---------- Cards / sections ---------- */
  .section-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:17px;
    margin:28px 0 12px;
    letter-spacing:-0.01em;
  }
  .section-title:first-child{margin-top:4px;}
  .card{
    background:var(--surface);
    border-radius:var(--radius-m);
    box-shadow:var(--shadow-card);
    padding:18px;
  }
  button.card{transition:transform 0.12s ease, box-shadow 0.15s ease; cursor:pointer;}
  button.card:active{transform:scale(0.985); box-shadow:0 1px 2px rgba(58,46,20,0.07), 0 4px 12px rgba(58,46,20,0.08);}
  .grid-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .stat-card{
    background:var(--surface);
    border-radius:var(--radius-m);
    box-shadow:var(--shadow-card);
    padding:14px 12px;
    display:flex; flex-direction:column; gap:4px;
  }
  .stat-card .lbl{font-size:10.5px; letter-spacing:0.03em; color:var(--ink-soft); text-transform:uppercase;}
  .stat-card .val{font-family:var(--font-mono); font-weight:600; font-size:15px;}
  .stat-card .val.gold{color:var(--gold-deep);}
  .stat-card .val.wine{color:var(--wine-deep);}
  @media (max-width:420px){
    .stat-card .val{font-size:13px;}
  }

  .chart-card{margin-top:14px;}
  .chart-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .chart-card-head h3{font-size:13.5px; font-weight:600; margin:0;}
  .legend{display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:10px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft);}
  .legend-item .sw{width:9px;height:9px;border-radius:2px;flex:none;}

  .empty{
    text-align:center;
    padding:40px 18px;
    color:var(--ink-soft);
  }
  .empty .big{font-family:var(--font-display); font-size:16px; color:var(--ink); margin-bottom:6px;}
  .empty .small{font-size:13px; line-height:1.5;}

  /* ---------- Transaction list ---------- */
  .filter-bar{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:14px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .filter-bar::-webkit-scrollbar{display:none;}
  .filter-bar select{
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:100px;
    padding:7px 12px;
    font-size:12.5px;
    color:var(--ink);
    flex:none;
  }
  .day-group{margin-bottom:16px;}
  .day-group-label{
    font-size:11.5px;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin:0 0 6px 2px;
  }
  .tx-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border-radius:var(--radius-s);
    padding:11px 12px;
    margin-bottom:6px;
    box-shadow:var(--shadow-card);
  }
  .tx-row .chip{
    flex:none;
    font-size:10.5px;
    font-weight:600;
    padding:4px 9px;
    border-radius:6px;
    color:#fff;
    white-space:nowrap;
    transform:rotate(-1deg);
  }
  .tx-row .mid{flex:1; min-width:0;}
  .tx-row .desc{font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tx-row .who{font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .tx-row .amt{font-family:var(--font-mono); font-weight:600; font-size:14px; flex:none;}
  .tx-row .amt.gold{color:var(--gold-deep);}
  .tx-row .amt.wine{color:var(--wine-deep);}
  button.edit{
    flex:none; background:none; border:none; color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center;
    width:40px; height:40px; margin:-8px -6px -8px 0; border-radius:50%;
  }
  button.edit:active{background:var(--surface-alt);}
  button.edit svg{width:16px;height:16px;}
  .list-total{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 4px 4px; font-size:13px; color:var(--ink-soft);
  }
  .list-total b{font-family:var(--font-mono); color:var(--ink); font-size:14px;}

  /* ---------- Categorias tab ---------- */
  .cat-row{
    background:var(--surface);
    border-radius:var(--radius-m);
    box-shadow:var(--shadow-card);
    padding:14px 16px;
    margin-bottom:10px;
  }
  .cat-row-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px;}
  .cat-row-name{display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600;}
  .cat-row-name .dot{width:10px;height:10px;border-radius:3px;flex:none;}
  .cat-row-nums{font-size:12px; color:var(--ink-soft); font-family:var(--font-mono);}
  .cat-row-nums b{color:var(--ink); font-weight:600;}
  .progress-track{height:7px; border-radius:100px; background:var(--surface-alt); overflow:hidden;}
  .progress-fill{height:100%; border-radius:100px;}
  .cat-row-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:9px; gap:10px;}
  .budget-input-wrap{display:flex; align-items:center; gap:6px;}
  .budget-input-wrap label{font-size:11px; color:var(--ink-faint);}
  .budget-input-wrap input{
    width:98px; border:1px solid var(--line); border-radius:8px; padding:5px 8px;
    font-size:16px; font-family:var(--font-mono); background:var(--surface-alt);
  }
  .budget-status{font-size:11px;}
  .budget-status.over{color:var(--wine-deep); font-weight:600;}
  .budget-status.ok{color:var(--moss);}

  /* ---------- Metas ---------- */
  .goal-card{
    background:var(--surface);
    border-radius:var(--radius-m);
    box-shadow:var(--shadow-card);
    padding:16px;
    margin-bottom:12px;
  }
  .goal-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .goal-title{font-family:var(--font-display); font-weight:600; font-size:15.5px;}
  .goal-deadline{font-size:11px; color:var(--ink-faint); margin-top:2px;}
  .goal-nums{display:flex; justify-content:space-between; font-size:12.5px; font-family:var(--font-mono); margin:8px 0 6px;}
  .goal-nums .cur{color:var(--gold-deep); font-weight:600;}
  .goal-actions{display:flex; gap:8px; margin-top:12px;}
  .btn{
    border-radius:100px;
    padding:9px 16px;
    font-size:13px;
    font-weight:600;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    transition:background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }
  .btn:hover{background:var(--surface-alt);}
  .btn:active{transform:scale(0.97);}
  .btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .btn.primary:hover{background:#1C1A12;}
  .btn.danger{color:var(--wine-deep); border-color:var(--wine-bg);}
  .btn.danger:hover{background:var(--wine-bg);}
  .btn.ghost{border-color:transparent; background:transparent;}
  .btn.small{padding:6px 12px; font-size:12px;}
  .btn.block{width:100%; text-align:center;}

  /* ---------- Ajustes ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-s);
    padding:10px 12px; font-size:16px; background:var(--surface-alt); color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .settings-actions{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .info-line{font-size:12px; color:var(--ink-faint); margin-top:18px; line-height:1.6;}

  /* ---------- Modal / sheet ---------- */
  @keyframes sheetUp{ from{ transform:translateY(24px); opacity:0.6; } to{ transform:translateY(0); opacity:1; } }
  @keyframes overlayIn{ from{ opacity:0; } to{ opacity:1; } }
  .overlay{
    position:fixed; inset:0; background:rgba(43,40,32,0.45);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:60; padding:0;
    animation:overlayIn 0.18s ease;
  }
  @media (min-width:640px){
    .overlay{align-items:center; padding:20px;}
  }
  .sheet{
    background:var(--surface);
    width:100%; max-width:480px;
    border-radius:22px 22px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
    box-shadow:var(--shadow-float);
    animation:sheetUp 0.22s cubic-bezier(.2,.7,.3,1);
  }
  @media (min-width:640px){ .sheet{border-radius:20px;} }
  .sheet-handle{width:36px;height:4px;border-radius:100px;background:var(--line);margin:0 auto 16px;}
  .sheet-title{font-family:var(--font-display); font-weight:600; font-size:18px; margin:0 0 16px;}
  .seg{display:flex; border:1px solid var(--line); border-radius:100px; padding:3px; margin-bottom:16px;}
  .seg button{flex:1; border:none; background:transparent; border-radius:100px; padding:9px; font-size:13px; font-weight:600; color:var(--ink-soft);}
  .seg button.active.despesa{background:var(--wine-bg); color:var(--wine-deep);}
  .seg button.active.receita{background:var(--moss-bg); color:var(--moss);}
  .seg button.active.compartilhado{background:var(--gold-bg); color:var(--gold-deep);}
  .seg button.active.individual{background:var(--surface-alt); color:var(--ink);}
  .money-field{display:flex; align-items:center; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--surface-alt); overflow:hidden;}
  .money-field span{padding:0 0 0 12px; font-size:14px; color:var(--ink-soft); font-family:var(--font-mono);}
  .money-field input{border:none; background:transparent; flex:1; padding:10px 12px 10px 6px; font-size:16px; font-family:var(--font-mono);}
  .money-field input:focus{outline:none;}
  .sheet-actions{display:flex; gap:10px; margin-top:20px;}
  .sheet-actions .btn{flex:1;}
  .field-error{color:var(--wine-deep); font-size:12px; margin-top:5px;}

  .confirm-box{
    background:var(--surface); border-radius:var(--radius-m); padding:22px;
    max-width:360px; width:100%; box-shadow:0 12px 30px rgba(0,0,0,0.18);
  }
  .confirm-box p{font-size:14px; line-height:1.5; margin:0 0 18px;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:100px;
    font-size:13px; z-index:80; box-shadow:0 8px 20px rgba(0,0,0,0.2);
  }
  @media (min-width:900px){ .toast{bottom:32px;} }

  /* loading */
  .loading-screen{
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    flex-direction:column; gap:10px; color:var(--ink-soft); font-size:13px;
  }
  .loading-screen .brand{margin-bottom:6px;}

  /* ---------- Onboarding ---------- */
  .onboard-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 16px;
  }
  .onboard-card{
    max-width:460px; width:100%; background:var(--surface); border-radius:var(--radius-l);
    box-shadow:var(--shadow-card); padding:26px 24px 28px;
  }
  .onboard-card .brand{font-size:22px; margin-bottom:6px;}
  .onboard-intro{font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin:0 0 18px;}
  .onboard-steps{
    background:var(--surface-alt); border-radius:var(--radius-s); padding:14px 16px;
    margin-bottom:18px; font-size:12.5px; color:var(--ink-soft); line-height:1.7;
  }
  .onboard-steps b{color:var(--ink);}
  .onboard-steps a{color:var(--gold-deep); font-weight:600;}
  .onboard-steps ol{margin:6px 0 0; padding-left:18px;}
  .onboard-steps li{margin-bottom:5px;}
  .onboard-error{
    background:var(--wine-bg); color:var(--wine-deep); border-radius:var(--radius-s);
    padding:10px 12px; font-size:12.5px; margin-bottom:14px; line-height:1.5;
  }
  .code-row{display:flex; gap:8px;}
  .code-row input{flex:1;}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.17.1/firebase-app-compat.min.js"></script>

    for (var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; }

  function fmtBRL(v){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0); }
  function parseMoney(str){
    if (typeof str !== 'string') return NaN;
    var clean = str.trim().replace(/[^\d,.\-]/g,'');
    if (clean.indexOf(',') > -1 && clean.indexOf('.') > -1){
      clean = clean.replace(/\./g,'').replace(',', '.');
    } else if (clean.indexOf(',') > -1){
      clean = clean.replace(',', '.');
    }
    return parseFloat(clean);
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function parseISODate(iso){
    var p = iso.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  }
  function fmtDateShort(iso){
    var d = parseISODate(iso);

  /* ================= CLOUD (Firebase Firestore) ================= */
  /* Real cross-device sync: each device connects once with the same Firebase
     project config + household code. Data lives in Firestore and updates
     push to every connected device automatically (no polling needed). */
  var LS_CONFIG_KEY = 'lc2_firebase_config';
  var LS_HOUSEHOLD_KEY = 'lc2_household_id';

  function getLocalCloudSetup(){
    try{
      var raw = window.localStorage.getItem(LS_CONFIG_KEY);
      var hid = window.localStorage.getItem(LS_HOUSEHOLD_KEY);
      if (!raw || !hid) return null;
      return { config: JSON.parse(raw), householdId: hid };
    } catch(e){ return null; }
  }
  function saveLocalCloudSetup(config, householdId){
    try{
      window.localStorage.setItem(LS_CONFIG_KEY, JSON.stringify(config));
      window.localStorage.setItem(LS_HOUSEHOLD_KEY, householdId);
      return true;
    } catch(e){ return false; }
  }
  function clearLocalCloudSetup(){
    try{ window.localStorage.removeItem(LS_CONFIG_KEY); window.localStorage.removeItem(LS_HOUSEHOLD_KEY); }catch(e){}
  }
  function extractConfigObjectText(raw){
    var idx = raw.indexOf('firebaseConfig');
    var searchFrom = idx > -1 ? idx : 0;
    var braceStart = raw.indexOf('{', searchFrom);
    if (braceStart === -1) return raw;
    var depth = 0;
    for (var i = braceStart; i < raw.length; i++){
      if (raw[i] === '{') depth++;
      else if (raw[i] === '}'){ depth--; if (depth === 0) return raw.slice(braceStart, i + 1); }
    }
    return raw.slice(braceStart);
  }
  function parseFlexibleConfig(raw){
    var objText = extractConfigObjectText(raw);
    try{ return JSON.parse(objText); } catch(e1){}
    try{ return (new Function('return (' + objText + ')'))(); } catch(e2){}
    return null;
  }

  function genHouseholdCode(){
    function seg(){ return Math.random().toString(36).slice(2,6).toUpperCase(); }
    return seg()+'-'+seg()+'-'+seg()+'-'+seg();
  }

  var cloud = { db:null, householdId:null, unsubs:[] };

  function householdRef(){ return cloud.db.collection('households').doc(cloud.householdId); }

  function connectCloud(config, householdId){
    state.cloud.connecting = true;
    state.cloud.error = null;
    render();
    try{
      if (typeof firebase === 'undefined'){
        state.cloud.connecting = false;
        state.cloud.error = 'Não foi possível carregar a biblioteca do Firebase. Verifique sua internet e recarregue a página.';
        render();
        return;
      }
      if (!firebase.apps || !firebase.apps.length){ firebase.initializeApp(config); }
      var db = firebase.firestore();
      try{ db.enablePersistence({ synchronizeTabs:true }).catch(function(){}); }catch(e){}
      cloud.db = db;
      cloud.householdId = householdId;

      var hhRef = householdRef();
      hhRef.set({ nome1: state.settings.nome1, nome2: state.settings.nome2 }, { merge:true }).catch(function(){});

      var gotHousehold = false;
      cloud.unsubs.push(hhRef.onSnapshot(function(doc){
        var data = doc.data() || {};
        state.settings.nome1 = data.nome1 || state.settings.nome1;
        state.settings.nome2 = data.nome2 || state.settings.nome2;
        state.settings.split1 = (typeof data.split1 === 'number') ? data.split1 : 50;
        state.settings.split2 = (typeof data.split2 === 'number') ? data.split2 : (100 - state.settings.split1);
        state.budgets = data.budgets || {};
        gotHousehold = true;
        state.loaded = true;
        state.cloud.connecting = false;
        state.cloud.connected = true;
        state.cloud.error = null;
        saveLocalCloudSetup(config, householdId);
        render();
      }, function(err){ handleCloudError(err); }));

      cloud.unsubs.push(hhRef.collection('transactions').onSnapshot(function(snap){
        var list = [];
        snap.forEach(function(d){ list.push(Object.assign({ id:d.id }, d.data())); });
        state.transactions = list;
        if (state.cloud.connected) render();
      }, function(err){ handleCloudError(err); }));

      cloud.unsubs.push(hhRef.collection('goals').onSnapshot(function(snap){
        var list = [];
        snap.forEach(function(d){ list.push(Object.assign({ id:d.id }, d.data())); });
        state.goals = list;
        if (state.cloud.connected) render();
      }, function(err){ handleCloudError(err); }));

      setTimeout(function(){
        if (!gotHousehold && state.cloud.connecting){
          state.cloud.connecting = false;
          state.cloud.error = 'Não foi possível conectar. Confira se colou a configuração certa e se as regras do Firestore foram salvas.';
          render();
        }
      }, 9000);
    } catch(e){
      state.cloud.connecting = false;
      state.cloud.error = 'Configuração inválida: ' + (e && e.message ? e.message : 'verifique o JSON colado.');
      render();
    }
  }

  function handleCloudError(err){
    state.cloud.connecting = false;
    var code = err && err.code;
    if (code === 'permission-denied'){
      state.cloud.error = 'Acesso negado pelo Firestore. Confira se colou exatamente as regras de segurança indicadas.';
    } else {
      state.cloud.error = 'Erro de conexão com o banco de dados: ' + (err && err.message ? err.message : 'tente novamente.');
    }
    render();
  }

  function disconnectCloud(){
    cloud.unsubs.forEach(function(u){ try{ u(); }catch(e){} });
    cloud.unsubs = [];
    cloud.db = null; cloud.householdId = null;
    clearLocalCloudSetup();
    state.cloud = { connected:false, connecting:false, error:null };
    state.loaded = false;
    render();
  }

  /* ---- CRUD helpers (write directly to Firestore; onSnapshot updates state) ---- */
  function upsertTransactionDoc(tx){
    return householdRef().collection('transactions').doc(tx.id).set(tx)
      .catch(function(){ showToast('Não foi possível salvar. Verifique sua internet.'); });
  }
  function deleteTransactionDoc(id){
    return householdRef().collection('transactions').doc(id).delete()
      .catch(function(){ showToast('Não foi possível excluir. Verifique sua internet.'); });
  }
  function upsertGoalDoc(g){
    return householdRef().collection('goals').doc(g.id).set(g)
      .catch(function(){ showToast('Não foi possível salvar a meta. Verifique sua internet.'); });
  }
  function deleteGoalDoc(id){
    return householdRef().collection('goals').doc(id).delete()
      .catch(function(){ showToast('Não foi possível excluir a meta. Verifique sua internet.'); });
  }
  function saveHouseholdMeta(){
    return householdRef().set({ nome1: state.settings.nome1, nome2: state.settings.nome2, split1: state.settings.split1, split2: state.settings.split2, budgets: state.budgets }, { merge:true })
      .catch(function(){ showToast('Não foi possível salvar. Verifique sua internet.'); });
  }
  function replaceAllTransactions(list){
    var batch = cloud.db.batch();
    list.forEach(function(tx){ batch.set(householdRef().collection('transactions').doc(tx.id), tx); });
    return batch.commit().catch(function(){ showToast('Não foi possível importar tudo. Tente novamente.'); });
  }
  function replaceAllGoals(list){
    var batch = cloud.db.batch();
    list.forEach(function(g){ batch.set(householdRef().collection('goals').doc(g.id), g); });
    return batch.commit().catch(function(){ showToast('Não foi possível importar as metas.'); });
  }
  function deleteAllInCollection(name){
    return householdRef().collection(name).get().then(function(snap){
      var batch = cloud.db.batch();
      snap.forEach(function(d){ batch.delete(d.ref); });
      return batch.commit();
    });
  }

  /* ================= COMPUTED ================= */
  function monthTransactions(year, month){
    return state.transactions.filter(function(t){
      var d = parseISODate(t.data);
      return d.getFullYear()===year && d.getMonth()===month;
    });
  }
  function sumTipo(list, tipo){
    return list.filter(function(t){return t.tipo===tipo;}).reduce(function(s,t){return s+t.valor;},0);
  }
  function sumPorCategoria(list, tipo){
    var out = {};
    list.filter(function(t){return t.tipo===tipo;}).forEach(function(t){
      out[t.categoria] = (out[t.categoria]||0) + t.valor;
    });
    return out;
  }
  function divisaoOf(t){ return t.divisao || 'individual'; }
  function despesasCompartilhadas(list){ return list.filter(function(t){ return t.tipo==='despesa' && divisaoOf(t)==='compartilhado'; }); }
  function despesasIndividuais(list, pessoa){ return list.filter(function(t){ return t.tipo==='despesa' && divisaoOf(t)==='individual' && (!pessoa || t.quem===pessoa); }); }
  function sumValores(list){ return list.reduce(function(s,t){ return s+t.valor; },0); }

  // Full split/settlement breakdown for a given transaction list (usually one month).
  function splitSummary(list){
    var s1 = state.settings.split1/100, s2 = state.settings.split2/100;
    var compartilhado = despesasCompartilhadas(list);
    var totalCompartilhado = sumValores(compartilhado);
    var pagoPor1 = sumValores(compartilhado.filter(function(t){return t.quem===state.settings.nome1;}));
    var pagoPor2 = sumValores(compartilhado.filter(function(t){return t.quem===state.settings.nome2;}));
    var justo1 = totalCompartilhado * s1;
    var justo2 = totalCompartilhado * s2;
    var individual1 = sumValores(despesasIndividuais(list, state.settings.nome1));
    var individual2 = sumValores(despesasIndividuais(list, state.settings.nome2));
    var renda1 = sumValores(list.filter(function(t){return t.tipo==='receita' && t.quem===state.settings.nome1;}));
    var renda2 = sumValores(list.filter(function(t){return t.tipo==='receita' && t.quem===state.settings.nome2;}));
    var totalGastos1 = individual1 + justo1;
    var totalGastos2 = individual2 + justo2;
    var diff1 = pagoPor1 - justo1; // positive: pessoa1 overpaid, pessoa2 owes them
    return {
      totalCompartilhado: totalCompartilhado,
      pago: { p1:pagoPor1, p2:pagoPor2 },
      justo: { p1:justo1, p2:justo2 },
      individual: { p1:individual1, p2:individual2 },
      renda: { p1:renda1, p2:renda2 },
      totalGastos: { p1:totalGastos1, p2:totalGastos2 },
      sobra: { p1:renda1-totalGastos1, p2:renda2-totalGastos2 },
      diff1: diff1 // >0: nome2 deve nome1 |diff1|; <0: nome1 deve nome2 |diff1|
    };
  }
  function settlementLabel(diff1, forPessoa){
    var cents = Math.round(Math.abs(diff1)*100)/100;
    if (cents < 0.01) return 'Contas em dia';
    var nome1 = state.settings.nome1, nome2 = state.settings.nome2;
    if (forPessoa === 1){
      return diff1 > 0 ? (nome2 + ' te deve ' + fmtBRL(cents)) : ('Você deve ' + fmtBRL(cents) + ' a ' + nome2);
    } else {
      return diff1 < 0 ? (nome1 + ' te deve ' + fmtBRL(cents)) : ('Você deve ' + fmtBRL(cents) + ' a ' + nome1);
    }
  }

  function showToast(msg){
    state.ui.toast = msg;
    renderToastOnly();
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ state.ui.toast = null; renderToastOnly(); }, 2600);
  }

    chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>',

  };

  var TABS = [
    {id:'inicio', label:'Início', icon:'inicio'},
    {id:'lancamentos', label:'Lançamentos', icon:'lancamentos'},
    {id:'pessoas', label:'Pessoas', icon:'pessoas'},
    {id:'categorias', label:'Categorias', icon:'categorias'},
    {id:'metas', label:'Metas', icon:'metas'},

  ];

  /* ================= RENDER: ROOT ================= */
  var renderScheduled = false;
  function render(){
    if (renderScheduled) return;
    renderScheduled = true;
    setTimeout(function(){
      renderScheduled = false;
      doRender();
    }, 0);
  }

  function doRender(){
    if (!state.cloud.connected){
      var appEl0 = document.getElementById('app');
      appEl0.innerHTML = renderOnboarding();
      appEl0.dataset.rendered = '1';
      return;
    }
    if (!state.loaded){
      document.getElementById('app').innerHTML =
        '<div class="loading-screen"><p class="brand" style="font-family:var(--font-display);font-size:20px;">Livro-Caixa a Dois</p><p>Carregando o painel…</p></div>';
      return;
    }
    destroyCharts();
    var html = ''
      + '<div class="shell">'
      +   renderTopbar()
      +   '<div class="shell-body">'
      +     renderNavDesktop()
      +     '<div class="main">' + renderTabContent() + '</div>'
      +   '</div>'
      +   renderNavMobile()
      +   '<button class="fab" data-action="open-add-transaction" aria-label="Adicionar lançamento">' + ICONS.plus + '</button>'
      + '</div>'
      + renderModal()
      + renderConfirm()
      + renderToast();
    var appEl = document.getElementById('app');
    appEl.innerHTML = html;
    appEl.dataset.rendered = '1';
    setTimeout(renderCharts, 0);
    var moneyInput = document.getElementById('field-valor');
    if (moneyInput) moneyInput.focus();
  }

  function renderToastOnly(){
    var existing = document.querySelector('.toast');
    if (existing) existing.remove();
    if (state.ui.toast){
      var d = document.createElement('div');
      d.className = 'toast';
      d.textContent = state.ui.toast;
      document.getElementById('app').appendChild(d);
    }
  }
  function syncLabel(){
    if (state.cloud.connecting) return 'conectando…';
    if (state.cloud.error) return 'sem conexão';
    if (state.cloud.connected) return 'em tempo real';
    return 'desconectado';
  }

  /* ================= RENDER: TOPBAR ================= */
  function renderTopbar(){
    var mtx = monthTransactions(state.ui.year, state.ui.month);
    var receitas = sumTipo(mtx, 'receita');
    var despesas = sumTipo(mtx, 'despesa');
    var saldo = receitas - despesas;
    var pct = receitas > 0 ? Math.min(despesas / receitas, 1) : (despesas > 0 ? 1 : 0);
    var r = 66, c = 2 * Math.PI * r;
    var wineLen = pct * c;
    var overspent = despesas > receitas && receitas > 0;

    return ''
    + '<div class="topbar">'
    +   '<div class="brand-row">'
    +     '<h1 class="brand">Livro-Caixa a Dois<small>' + escapeHtml(state.settings.nome1) + ' &amp; ' + escapeHtml(state.settings.nome2) + '</small></h1>'
    +     '<button class="sync-btn" data-action="refresh"><span class="sync-dot" style="background:' + (state.cloud.connected ? 'var(--moss)' : 'var(--wine)') + '"></span><span id="sync-time">' + syncLabel() + '</span></button>'
    +   '</div>'
    +   '<div class="month-nav">'
    +     '<button data-action="prev-month" aria-label="Mês anterior">' + ICONS.chevL + '</button>'
    +     '<span class="month-label">' + MESES[state.ui.month] + ' de ' + state.ui.year + '</span>'
    +     '<button data-action="next-month" aria-label="Próximo mês">' + ICONS.chevR + '</button>'
    +   '</div>'
    +   '<div class="seal-wrap">'
    +     '<div class="seal">'
    +       '<svg viewBox="0 0 160 160">'
    +         '<circle cx="80" cy="80" r="'+r+'" fill="none" stroke="var(--surface-alt)" stroke-width="14"/>'
    +         '<circle cx="80" cy="80" r="'+r+'" fill="none" stroke="var(--gold)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="0"/>'
    +         '<circle cx="80" cy="80" r="'+r+'" fill="none" stroke="var(--wine)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+wineLen+' '+(c-wineLen)+'" stroke-dashoffset="0"/>'
    +       '</svg>'
    +       '<div class="seal-center">'
    +         '<span class="seal-value ' + (saldo < 0 ? 'neg':'pos') + '">' + fmtBRL(saldo) + '</span>'
    +         '<span class="seal-caption">saldo do mês</span>'
    +         (overspent ? '<span class="seal-warn">gastos acima da renda do mês</span>' : '')
    +       '</div>'
    +     '</div>'
    +     '<div class="stat-mini-col">'
    +       '<div class="stat-mini"><span class="dot gold"></span><span class="txt"><span class="lbl">Receitas</span><span class="val">' + fmtBRL(receitas) + '</span></span></div>'
    +       '<div class="stat-mini"><span class="dot wine"></span><span class="txt"><span class="lbl">Despesas</span><span class="val">' + fmtBRL(despesas) + '</span></span></div>'
    +     '</div>'
    +   '</div>'
    + '</div>';
  }

  /* ================= RENDER: NAV ================= */
  function navItemsHtml(){
    return TABS.map(function(t){
      return '<button class="nav-item ' + (state.ui.tab===t.id?'active':'') + '" data-action="set-tab" data-tab="' + t.id + '">' + ICONS[t.icon] + '<span>' + t.label + '</span></button>';
    }).join('');
  }
  function renderNavDesktop(){ return '<nav class="nav-desktop">' + navItemsHtml() + '</nav>'; }
  function renderNavMobile(){ return '<nav class="nav-mobile">' + navItemsHtml() + '</nav>'; }

  /* ================= RENDER: TAB ROUTER ================= */
  function renderTabContent(){
    switch(state.ui.tab){
      case 'inicio': return renderTabInicio();
      case 'lancamentos': return renderTabLancamentos();
      case 'pessoas': return renderTabPessoas();
      case 'categorias': return renderTabCategorias();
      case 'metas': return renderTabMetas();
      case 'ajustes': return renderTabAjustes();
      default: return '';
    }
  }

  /* ---------- INÍCIO ---------- */
  function renderTabInicio(){
    var mtx = monthTransactions(state.ui.year, state.ui.month);
    var despesas = mtx.filter(function(t){return t.tipo==='despesa';});
    var receitas = sumTipo(mtx,'receita');
    var totalDespesas = sumTipo(mtx,'despesa');
    var saldo = receitas - totalDespesas;
    var porCat = sumPorCategoria(mtx, 'despesa');
    var sum = splitSummary(mtx);

    var recentes = state.transactions.slice().sort(function(a,b){ return b.data.localeCompare(a.data) || b.criadoEm - a.criadoEm; }).slice(0,5);

    var html = '';

    var situ1 = settlementLabel(sum.diff1, 1);
    var situColor1 = Math.abs(sum.diff1) < 0.01 ? 'var(--ink-soft)' : (sum.diff1 > 0 ? 'var(--moss)' : 'var(--wine-deep)');
    html += '<button class="card" data-action="set-tab" data-tab="pessoas" style="width:100%;text-align:left;border:none;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;">'
      + '<span><span style="display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);margin-bottom:3px;">Acerto de contas do mês</span><span style="font-family:var(--font-display);font-weight:600;font-size:15px;color:' + situColor1 + '">' + situ1 + '</span></span>'
      + '<span style="color:var(--ink-faint);">' + ICONS.chevR + '</span>'
      + '</button>';

    html += '<div class="grid-stats">'
      + '<div class="stat-card"><span class="lbl">Receitas</span><span class="val gold">' + fmtBRL(receitas) + '</span></div>'
      + '<div class="stat-card"><span class="lbl">Despesas</span><span class="val wine">' + fmtBRL(totalDespesas) + '</span></div>'
      + '<div class="stat-card"><span class="lbl">Saldo</span><span class="val" style="color:' + (saldo<0?'var(--wine-deep)':'var(--ink)') + '">' + fmtBRL(saldo) + '</span></div>'
      + '</div>';

    html += '<div class="chart-card card">'
      + '<div class="chart-card-head"><h3>Distribuição da renda</h3></div>';
    if (receitas <= 0){
      html += '<div class="empty" style="padding:28px 12px;"><p class="small">Lance a renda do mês para ver essa distribuição.</p></div>';
    } else {
      html += '<div style="position:relative;height:200px;"><canvas id="chart-distrib" role="img" aria-label="Gráfico de distribuição da renda entre compartilhado, individual e sobra"></canvas></div>';
      html += '<div class="legend">'
        + '<span class="legend-item"><span class="sw" style="background:#4A4436"></span>Compartilhado · ' + fmtBRL(sum.totalCompartilhado) + '</span>'
        + '<span class="legend-item"><span class="sw" style="background:#8B5A6B"></span>Individual ' + escapeHtml(state.settings.nome1) + ' · ' + fmtBRL(sum.individual.p1) + '</span>'
        + '<span class="legend-item"><span class="sw" style="background:#5C7A8A"></span>Individual ' + escapeHtml(state.settings.nome2) + ' · ' + fmtBRL(sum.individual.p2) + '</span>'
        + '<span class="legend-item"><span class="sw" style="background:#C08A34"></span>Sobra · ' + fmtBRL(Math.max(saldo,0)) + '</span>'
        + '</div>';
    }
    html += '</div>';

    html += '<div class="chart-card card">'
      + '<div class="chart-card-head"><h3>Despesas por categoria</h3></div>';
    if (Object.keys(porCat).length === 0){
      html += '<div class="empty" style="padding:28px 12px;"><p class="small">Ainda não há despesas lançadas neste mês.</p></div>';
    } else {
      html += '<div style="position:relative;height:220px;"><canvas id="chart-donut" role="img" aria-label="Gráfico de despesas por categoria no mês"></canvas></div>';
      html += '<div class="legend">' + Object.keys(porCat).sort(function(a,b){return porCat[b]-porCat[a];}).map(function(id){
        var c = catById(id,'despesa');
        return '<span class="legend-item"><span class="sw" style="background:'+c.color+'"></span>' + c.label + ' · ' + fmtBRL(porCat[id]) + '</span>';
      }).join('') + '</div>';
    }
    html += '</div>';

    var trend = last6MonthsSaldo();
    html += '<div class="chart-card card">'
      + '<div class="chart-card-head"><h3>Histórico de saldo (6 meses)</h3></div>'
      + '<div style="position:relative;height:180px;"><canvas id="chart-trend" role="img" aria-label="Gráfico de saldo mensal dos últimos seis meses"></canvas></div>'
      + '</div>';

    html += '<h2 class="section-title">Histórico mensal</h2>';
    html += renderHistoricoTable();

    html += '<h2 class="section-title">Últimos lançamentos</h2>';
    if (recentes.length === 0){
      html += emptyState('Nada por aqui ainda', 'Toque no botão + para registrar o primeiro lançamento de vocês dois.');
    } else {
      html += recentes.map(txRowHtml).join('');
    }
    return html;
  }

  function last6MonthsSaldo(){
    var out = [];
    for (var i=5;i>=0;i--){
      var d = new Date(state.ui.year, state.ui.month - i, 1);
      var mtx = monthTransactions(d.getFullYear(), d.getMonth());
      out.push({label: MESES_ABR[d.getMonth()], saldo: sumTipo(mtx,'receita') - sumTipo(mtx,'despesa')});
    }
    return out;
  }

  function renderHistoricoTable(){
    var rows = [];
    for (var i=5;i>=0;i--){
      var d = new Date(state.ui.year, state.ui.month - i, 1);
      var mtx = monthTransactions(d.getFullYear(), d.getMonth());
      if (mtx.length === 0) continue;
      var s = splitSummary(mtx);
      var renda = s.renda.p1 + s.renda.p2;
      var gastos = s.totalCompartilhado + s.individual.p1 + s.individual.p2;
      rows.push({
        label: MESES_ABR[d.getMonth()] + '/' + d.getFullYear(),
        renda: renda, gastos: gastos, sobra: renda-gastos,
        compartilhado: s.totalCompartilhado, ind1: s.individual.p1, ind2: s.individual.p2
      });
    }
    if (rows.length === 0){
      return emptyState('Sem histórico ainda', 'Assim que vocês lançarem alguns meses, o histórico aparece aqui automaticamente.');
    }
    var head = '<tr>'
      + '<th style="text-align:left;padding:8px 10px;font-size:11px;color:var(--ink-faint);text-transform:uppercase;border-bottom:1px solid var(--line);">Mês</th>'
      + '<th style="text-align:right;padding:8px 10px;font-size:11px;color:var(--ink-faint);text-transform:uppercase;border-bottom:1px solid var(--line);">Renda</th>'
      + '<th style="text-align:right;padding:8px 10px;font-size:11px;color:var(--ink-faint);text-transform:uppercase;border-bottom:1px solid var(--line);">Gastos</th>'
      + '<th style="text-align:right;padding:8px 10px;font-size:11px;color:var(--ink-faint);text-transform:uppercase;border-bottom:1px solid var(--line);">Sobra</th>'
      + '<th style="text-align:right;padding:8px 10px;font-size:11px;color:var(--ink-faint);text-transform:uppercase;border-bottom:1px solid var(--line);">Compart.</th>'
      + '<th style="text-align:right;padding:8px 10px;font-size:11px;color:var(--ink-faint);text-transform:uppercase;border-bottom:1px solid var(--line);">Ind. ' + escapeHtml(state.settings.nome1) + '</th>'
      + '<th style="text-align:right;padding:8px 10px;font-size:11px;color:var(--ink-faint);text-transform:uppercase;border-bottom:1px solid var(--line);">Ind. ' + escapeHtml(state.settings.nome2) + '</th>'
      + '</tr>';
    var body = rows.reverse().map(function(r){
      return '<tr>'
        + '<td style="padding:8px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;">' + r.label + '</td>'
        + '<td style="padding:8px 10px;font-size:12px;text-align:right;font-family:var(--font-mono);white-space:nowrap;">' + fmtBRL(r.renda) + '</td>'
        + '<td style="padding:8px 10px;font-size:12px;text-align:right;font-family:var(--font-mono);white-space:nowrap;">' + fmtBRL(r.gastos) + '</td>'
        + '<td style="padding:8px 10px;font-size:12px;text-align:right;font-family:var(--font-mono);white-space:nowrap;color:' + (r.sobra<0?'var(--wine-deep)':'var(--ink)') + '">' + fmtBRL(r.sobra) + '</td>'
        + '<td style="padding:8px 10px;font-size:12px;text-align:right;font-family:var(--font-mono);white-space:nowrap;">' + fmtBRL(r.compartilhado) + '</td>'
        + '<td style="padding:8px 10px;font-size:12px;text-align:right;font-family:var(--font-mono);white-space:nowrap;">' + fmtBRL(r.ind1) + '</td>'
        + '<td style="padding:8px 10px;font-size:12px;text-align:right;font-family:var(--font-mono);white-space:nowrap;">' + fmtBRL(r.ind2) + '</td>'
        + '</tr>';
    }).join('');
    return '<div class="card" style="padding:6px 4px;overflow-x:auto;"><table style="width:100%;border-collapse:collapse;min-width:560px;">' + head + body + '</table></div>';
  }

  /* ---------- LANÇAMENTOS ---------- */
  function renderTabLancamentos(){
    var f = state.ui.filters;
    var list = monthTransactions(state.ui.year, state.ui.month);
    if (f.tipo !== 'todos') list = list.filter(function(t){return t.tipo===f.tipo;});
    if (f.quem !== 'todos') list = list.filter(function(t){return t.quem===f.quem;});
    if (f.categoria !== 'todos') list = list.filter(function(t){return t.categoria===f.categoria;});
    list = list.slice().sort(function(a,b){ return b.data.localeCompare(a.data) || b.criadoEm - a.criadoEm; });

    var allCatOptions = DESPESA_CATS.concat(RECEITA_CATS);
    var seenCatIds = {};
    var catOptionsHtml = allCatOptions.filter(function(c){
      if (seenCatIds[c.id]) return false; seenCatIds[c.id]=true; return true;
    }).map(function(c){ return '<option value="'+c.id+'" '+(f.categoria===c.id?'selected':'')+'>'+c.label+'</option>'; }).join('');

    var html = '<div class="filter-bar">'
      + '<select data-filter="tipo"><option value="todos">Todos os tipos</option><option value="despesa" '+(f.tipo==='despesa'?'selected':'')+'>Despesas</option><option value="receita" '+(f.tipo==='receita'?'selected':'')+'>Receitas</option></select>'
      + '<select data-filter="quem"><option value="todos">Todos</option><option value="'+escapeHtml(state.settings.nome1)+'" '+(f.quem===state.settings.nome1?'selected':'')+'>'+escapeHtml(state.settings.nome1)+'</option><option value="'+escapeHtml(state.settings.nome2)+'" '+(f.quem===state.settings.nome2?'selected':'')+'>'+escapeHtml(state.settings.nome2)+'</option></select>'
      + '<select data-filter="categoria"><option value="todos">Todas as categorias</option>' + catOptionsHtml + '</select>'
      + '</div>';

    if (list.length === 0){
      html += emptyState('Nenhum lançamento aqui', 'Ajuste os filtros ou toque em + para adicionar um novo lançamento neste mês.');
      return html;
    }

    var groups = {};
    var order = [];
    list.forEach(function(t){
      if (!groups[t.data]){ groups[t.data]=[]; order.push(t.data); }
      groups[t.data].push(t);
    });

    var total = list.reduce(function(s,t){ return s + (t.tipo==='receita'?t.valor:-t.valor); }, 0);

    order.forEach(function(dateKey){
      html += '<div class="day-group"><p class="day-group-label">' + fmtDateShort(dateKey) + '</p>';
      html += groups[dateKey].map(txRowHtml).join('');
      html += '</div>';
    });

    html += '<div class="list-total"><span>Total do período filtrado</span><b>' + fmtBRL(total) + '</b></div>';
    return html;
  }

  function txRowHtml(t){
    var c = catById(t.categoria, t.tipo);
    var sign = t.tipo === 'receita' ? '+' : '−';
    var divBadge = t.tipo === 'despesa' ? (' · ' + (divisaoOf(t)==='compartilhado' ? 'Compartilhado' : 'Individual')) : '';
    return '<div class="tx-row">'
      + '<span class="chip" style="background:'+c.color+'">'+c.label+'</span>'
      + '<div class="mid"><div class="desc">' + escapeHtml(t.descricao || c.label) + '</div><div class="who">' + escapeHtml(t.quem) + ' · ' + fmtDateShort(t.data) + divBadge + '</div></div>'
      + '<span class="amt ' + (t.tipo==='receita'?'gold':'wine') + '">' + sign + ' ' + fmtBRL(t.valor) + '</span>'
      + '<button class="edit" data-action="edit-transaction" data-id="'+t.id+'" aria-label="Editar lançamento">' + ICONS.edit + '</button>'
      + '</div>';
  }

  /* ---------- PESSOAS ---------- */
  function renderTabPessoas(){
    var sel = state.ui.pessoaSel === 2 ? 2 : 1;
    var nomeSel = sel === 1 ? state.settings.nome1 : state.settings.nome2;
    var nomeOutro = sel === 1 ? state.settings.nome2 : state.settings.nome1;
    var mtx = monthTransactions(state.ui.year, state.ui.month);
    var sum = splitSummary(mtx);

    var renda = sel===1 ? sum.renda.p1 : sum.renda.p2;
    var individual = sel===1 ? sum.individual.p1 : sum.individual.p2;
    var pago = sel===1 ? sum.pago.p1 : sum.pago.p2;
    var justo = sel===1 ? sum.justo.p1 : sum.justo.p2;
    var totalGastos = sel===1 ? sum.totalGastos.p1 : sum.totalGastos.p2;
    var sobra = sel===1 ? sum.sobra.p1 : sum.sobra.p2;
    var situacao = settlementLabel(sum.diff1, sel);
    var diffForSel = sel===1 ? sum.diff1 : -sum.diff1;
    var situColor = Math.abs(diffForSel) < 0.01 ? 'var(--ink-soft)' : (diffForSel > 0 ? 'var(--moss)' : 'var(--wine-deep)');

    var porCatInd = {};
    despesasIndividuais(mtx, nomeSel).forEach(function(t){ porCatInd[t.categoria] = (porCatInd[t.categoria]||0) + t.valor; });

    var html = '<div class="seg" style="margin-bottom:16px;">'
      + '<button class="' + (sel===1?'active receita':'') + '" data-action="set-pessoa" data-pessoa="1">' + escapeHtml(state.settings.nome1) + '</button>'
      + '<button class="' + (sel===2?'active receita':'') + '" data-action="set-pessoa" data-pessoa="2">' + escapeHtml(state.settings.nome2) + '</button>'
      + '</div>';

    html += '<div class="card" style="text-align:center;padding:22px 18px;margin-bottom:14px;">'
      + '<p style="font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 8px;">Situação (acerto de contas)</p>'
      + '<p style="font-family:var(--font-display);font-weight:600;font-size:19px;margin:0;color:' + situColor + '">' + situacao + '</p>'
      + '</div>';

    html += '<div class="grid-stats" style="margin-bottom:14px;">'
      + '<div class="stat-card"><span class="lbl">Renda</span><span class="val gold">' + fmtBRL(renda) + '</span></div>'
      + '<div class="stat-card"><span class="lbl">Total de gastos</span><span class="val wine">' + fmtBRL(totalGastos) + '</span></div>'
      + '<div class="stat-card"><span class="lbl">Sobra estimada</span><span class="val" style="color:' + (sobra<0?'var(--wine-deep)':'var(--ink)') + '">' + fmtBRL(sobra) + '</span></div>'
      + '</div>';

    html += '<div class="card" style="margin-bottom:14px;">'
      + '<p style="font-size:13px;font-weight:600;margin:0 0 12px;">Divisão do compartilhado</p>'
      + '<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);"><span style="color:var(--ink-soft);">Total de gastos individuais</span><span style="font-family:var(--font-mono);font-weight:600;">' + fmtBRL(individual) + '</span></div>'
      + '<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);"><span style="color:var(--ink-soft);">Total pago em despesas compartilhadas</span><span style="font-family:var(--font-mono);font-weight:600;">' + fmtBRL(pago) + '</span></div>'
      + '<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;"><span style="color:var(--ink-soft);">Sua parte justa do compartilhado (' + (sel===1?state.settings.split1:state.settings.split2) + '%)</span><span style="font-family:var(--font-mono);font-weight:600;">' + fmtBRL(justo) + '</span></div>'
      + '</div>';

    html += '<div class="chart-card card" style="margin-bottom:14px;">'
      + '<div class="chart-card-head"><h3>Por que ' + (diffForSel>=0?'devem a':'você deve a') + '</h3></div>'
      + '<p style="font-size:12px;color:var(--ink-soft);margin:-4px 0 10px;">Comparando o que ' + escapeHtml(nomeSel) + ' pagou de despesas compartilhadas com a parte que caberia (' + (sel===1?state.settings.split1:state.settings.split2) + '%).</p>'
      + '<div style="position:relative;height:100px;"><canvas id="chart-pessoa-justo" role="img" aria-label="Gráfico comparando quanto a pessoa pagou de compartilhado com a parte justa dela"></canvas></div>'
      + '</div>';

    html += '<div class="chart-card card" style="margin-bottom:14px;">'
      + '<div class="chart-card-head"><h3>Gastos individuais por categoria</h3></div>';
    if (Object.keys(porCatInd).length === 0){
      html += '<div class="empty" style="padding:28px 12px;"><p class="small">' + escapeHtml(nomeSel) + ' ainda não tem despesas individuais lançadas neste mês.</p></div>';
    } else {
      html += '<div style="position:relative;height:200px;"><canvas id="chart-pessoa-donut" role="img" aria-label="Gráfico de gastos individuais por categoria"></canvas></div>';
      html += '<div class="legend">' + Object.keys(porCatInd).sort(function(a,b){return porCatInd[b]-porCatInd[a];}).map(function(id){
        var c = catById(id,'despesa');
        return '<span class="legend-item"><span class="sw" style="background:'+c.color+'"></span>' + c.label + ' · ' + fmtBRL(porCatInd[id]) + '</span>';
      }).join('') + '</div>';
    }
    html += '</div>';

    html += '<div class="chart-card card">'
      + '<div class="chart-card-head"><h3>Sobra de ' + escapeHtml(nomeSel) + ' (6 meses)</h3></div>'
      + '<div style="position:relative;height:170px;"><canvas id="chart-pessoa-sobra" role="img" aria-label="Gráfico do valor que sobrou para essa pessoa nos últimos seis meses"></canvas></div>'
      + '</div>';

    return html;
  }

  /* ---------- CATEGORIAS ---------- */
  function renderTabCategorias(){
    var mtx = monthTransactions(state.ui.year, state.ui.month);
    var porCat = sumPorCategoria(mtx, 'despesa');

    var html = '<p style="font-size:13px;color:var(--ink-soft);margin:0 0 14px;">Defina um orçamento mensal por categoria e acompanhe o quanto já foi gasto em ' + MESES[state.ui.month] + '.</p>';

    DESPESA_CATS.forEach(function(c){
      var gasto = porCat[c.id] || 0;
      var orc = state.budgets[c.id] || 0;
      var pct = orc > 0 ? Math.min(gasto / orc, 1) : (gasto > 0 ? 1 : 0);
      var over = orc > 0 && gasto > orc;
      html += '<div class="cat-row">'
        + '<div class="cat-row-top">'
        +   '<span class="cat-row-name"><span class="dot" style="background:'+c.color+'"></span>' + c.label + '</span>'
        +   '<span class="cat-row-nums"><b>' + fmtBRL(gasto) + '</b>' + (orc>0 ? ' de ' + fmtBRL(orc) : '') + '</span>'
        + '</div>'
        + '<div class="progress-track"><div class="progress-fill" style="width:'+(pct*100)+'%;background:'+(over?'var(--wine)':c.color)+'"></div></div>'
        + '<div class="cat-row-bottom">'
        +   '<div class="budget-input-wrap"><label>Orçamento</label><input type="text" inputmode="decimal" data-budget-cat="'+c.id+'" value="'+(orc>0?orc:'')+'" placeholder="R$ 0,00"></div>'
        +   (orc>0 ? '<span class="budget-status '+(over?'over':'ok')+'">' + (over ? 'excedeu em ' + fmtBRL(gasto-orc) : fmtBRL(orc-gasto) + ' restante') + '</span>' : '')
        + '</div>'
        + '</div>';
    });

    var hasBudgets = Object.keys(state.budgets).some(function(k){return state.budgets[k]>0;});

    }
    return html;
  }

  /* ================= CHARTS ================= */
  function destroyCharts(){
    Object.keys(chartRefs).forEach(function(k){ try{ chartRefs[k].destroy(); }catch(e){} });
    chartRefs = {};
  }

  function mkChart(key, el, config){
    if (!el) return;
    try{
      if (chartRefs[key]){ try{ chartRefs[key].destroy(); }catch(e){} }
      chartRefs[key] = new Chart(el, config);
    } catch(e){ /* one broken chart should never take down the rest */ }
  }

  var PESSOA1_COLOR = '#8B5A6B';
  var PESSOA2_COLOR = '#5C7A8A';

  function renderCharts(){
    if (typeof Chart === 'undefined') return;
    if (state.ui.tab === 'inicio'){
      var mtx = monthTransactions(state.ui.year, state.ui.month);
      var porCat = sumPorCategoria(mtx, 'despesa');
      var sum = splitSummary(mtx);
      var receitasTotal = sumTipo(mtx,'receita');
      var saldoAtual = receitasTotal - sumTipo(mtx,'despesa');

      if (receitasTotal > 0){
        mkChart('distrib', document.getElementById('chart-distrib'), {
          type:'doughnut',
          data:{ labels: ['Compartilhado', 'Individual ' + state.settings.nome1, 'Individual ' + state.settings.nome2, 'Sobra'],
                 datasets:[{ data: [sum.totalCompartilhado, sum.individual.p1, sum.individual.p2, Math.max(saldoAtual,0)], backgroundColor: ['#4A4436', PESSOA1_COLOR, PESSOA2_COLOR, '#C08A34'], borderColor:'#FFFFFF', borderWidth:2 }] },
          options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return ctx.label+': '+fmtBRL(ctx.parsed); } } } } }
        });
      }

      if (Object.keys(porCat).length){
        var ids = Object.keys(porCat).sort(function(a,b){return porCat[b]-porCat[a];});
        mkChart('donut', document.getElementById('chart-donut'), {
          type:'doughnut',
          data:{ labels: ids.map(function(id){return catById(id,'despesa').label;}),
                 datasets:[{ data: ids.map(function(id){return porCat[id];}), backgroundColor: ids.map(function(id){return catById(id,'despesa').color;}), borderColor:'#FFFFFF', borderWidth:2 }] },
          options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return ctx.label+': '+fmtBRL(ctx.parsed); } } } } }
        });
      }
      var trend = last6MonthsSaldo();
      mkChart('trend', document.getElementById('chart-trend'), {
        type:'bar',
        data:{ labels: trend.map(function(t){return t.label;}),
               datasets:[{ data: trend.map(function(t){return t.saldo;}), backgroundColor: trend.map(function(t){return t.saldo<0?'#B2603E':'#C08A34';}), borderRadius:4, maxBarThickness:28 }] },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return fmtBRL(ctx.parsed.y); } } } },
          scales:{ y:{ grid:{ color:'#E4DAC0' }, ticks:{ callback:function(v){ return 'R$ '+v; }, font:{size:10.5} } }, x:{ grid:{display:false}, ticks:{font:{size:11}} } } }
      });
    }
    if (state.ui.tab === 'categorias'){
      var mtx2 = monthTransactions(state.ui.year, state.ui.month);
      var porCat2 = sumPorCategoria(mtx2, 'despesa');
      var catsWithBudget = DESPESA_CATS.filter(function(c){ return (state.budgets[c.id]||0) > 0 || (porCat2[c.id]||0) > 0; });
      mkChart('budget', document.getElementById('chart-budget'), {
        type:'bar',
        data:{ labels: catsWithBudget.map(function(c){return c.label;}),
          datasets:[
            { label:'Orçado', data: catsWithBudget.map(function(c){return state.budgets[c.id]||0;}), backgroundColor:'#E2D6B8', borderRadius:4 },
            { label:'Gasto', data: catsWithBudget.map(function(c){return porCat2[c.id]||0;}), backgroundColor: catsWithBudget.map(function(c){return c.color;}), borderRadius:4 }
          ] },
        options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return ctx.dataset.label+': '+fmtBRL(ctx.parsed.x); } } } },
          scales:{ x:{ grid:{color:'#E4DAC0'}, ticks:{ callback:function(v){return 'R$ '+v;}, font:{size:10} } }, y:{ grid:{display:false}, ticks:{font:{size:11.5}} } } }
      });
    }
    if (state.ui.tab === 'pessoas'){
      var sel = state.ui.pessoaSel === 2 ? 2 : 1;
      var nomeSel = sel === 1 ? state.settings.nome1 : state.settings.nome2;
      var pessoaColor = sel === 1 ? PESSOA1_COLOR : PESSOA2_COLOR;
      var mtxP = monthTransactions(state.ui.year, state.ui.month);
      var sumP = splitSummary(mtxP);
      var porCatInd = {};
      despesasIndividuais(mtxP, nomeSel).forEach(function(t){ porCatInd[t.categoria] = (porCatInd[t.categoria]||0) + t.valor; });

      if (Object.keys(porCatInd).length){
        var idsP = Object.keys(porCatInd).sort(function(a,b){return porCatInd[b]-porCatInd[a];});
        mkChart('pessoaDonut', document.getElementById('chart-pessoa-donut'), {
          type:'doughnut',
          data:{ labels: idsP.map(function(id){return catById(id,'despesa').label;}),
                 datasets:[{ data: idsP.map(function(id){return porCatInd[id];}), backgroundColor: idsP.map(function(id){return catById(id,'despesa').color;}), borderColor:'#FFFFFF', borderWidth:2 }] },
          options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return ctx.label+': '+fmtBRL(ctx.parsed); } } } } }
        });
      }

      var pago = sel===1 ? sumP.pago.p1 : sumP.pago.p2;
      var justo = sel===1 ? sumP.justo.p1 : sumP.justo.p2;
      mkChart('pessoaJusto', document.getElementById('chart-pessoa-justo'), {
        type:'bar',
        data:{ labels:['Pagou de compartilhado', 'Parte justa'],
               datasets:[{ data:[pago, justo], backgroundColor:[pessoaColor, '#E2D6B8'], borderRadius:6, maxBarThickness:46 }] },
        options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return fmtBRL(ctx.parsed.x); } } } },
          scales:{ x:{ grid:{color:'#E4DAC0'}, ticks:{ callback:function(v){return 'R$ '+v;}, font:{size:10} } }, y:{ grid:{display:false}, ticks:{font:{size:12,weight:'500'}} } } }
      });

      var sobraTrend = [];
      for (var i=5;i>=0;i--){
        var d = new Date(state.ui.year, state.ui.month - i, 1);
        var mtxM = monthTransactions(d.getFullYear(), d.getMonth());
        var sM = splitSummary(mtxM);
        sobraTrend.push({ label: MESES_ABR[d.getMonth()], sobra: sel===1 ? sM.sobra.p1 : sM.sobra.p2 });
      }
      mkChart('pessoaSobra', document.getElementById('chart-pessoa-sobra'), {
        type:'bar',
        data:{ labels: sobraTrend.map(function(t){return t.label;}),
               datasets:[{ data: sobraTrend.map(function(t){return t.sobra;}), backgroundColor: sobraTrend.map(function(t){return t.sobra<0?'#B2603E':pessoaColor;}), borderRadius:4, maxBarThickness:28 }] },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return fmtBRL(ctx.parsed.y); } } } },
          scales:{ y:{ grid:{ color:'#E4DAC0' }, ticks:{ callback:function(v){ return 'R$ '+v; }, font:{size:10.5} } }, x:{ grid:{display:false}, ticks:{font:{size:11}} } } }
      });
    }
  }

  /* ================= ACTIONS ================= */
  function openAddTransaction(){ state.ui.modal = { type:'transaction', tipo:'despesa' }; render(); }
  function closeModal(){ state.ui.modal = null; render(); }

  function saveTransactionFromModal(editingId){
    var tipoBtn = document.querySelector('.seg button.active.despesa, .seg button.active.receita');
    var tipo = tipoBtn ? tipoBtn.getAttribute('data-tipo') : 'despesa';
    var valorRaw = document.getElementById('field-valor').value;
    var valor = parseMoney(valorRaw);
    var errEl = document.getElementById('err-valor');
    if (!valor || valor <= 0 || isNaN(valor)){
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    var categoria = document.getElementById('field-categoria').value;
    var data = document.getElementById('field-data').value || todayISO();
    var quem = document.getElementById('field-quem').value;
    var descricao = document.getElementById('field-descricao').value.trim();
    var divisaoBtn = document.querySelector('.seg button.active.compartilhado, .seg button.active.individual');
    var divisao = tipo === 'despesa' ? (divisaoBtn ? divisaoBtn.getAttribute('data-divisao') : 'compartilhado') : null;

    var tx;
    if (editingId){
      var existing = state.transactions.find(function(t){return t.id===editingId;}) || {};
      tx = Object.assign({}, existing, { id:editingId, tipo:tipo, valor:valor, categoria:categoria, data:data, quem:quem, descricao:descricao, divisao:divisao });
    } else {
      tx = { id: genId(), tipo:tipo, valor:valor, categoria:categoria, data:data, quem:quem, descricao:descricao, divisao:divisao, criadoEm: Date.now() };
    }
    state.ui.modal = null;
    showToast(editingId ? 'Lançamento atualizado' : 'Lançamento adicionado');
    render();
    upsertTransactionDoc(tx);
  }

  function deleteTransaction(id){
    state.ui.modal = null;
    showToast('Lançamento excluído');
    render();
    deleteTransactionDoc(id);
  }

  function openAddGoal(){ state.ui.modal = { type:'goal' }; render(); }
  function openEditGoal(id){ state.ui.modal = { type:'goal', editingId:id }; render(); }

  function saveGoalFromModal(editingId){
    var titulo = document.getElementById('field-titulo').value.trim();
    var alvo = parseMoney(document.getElementById('field-alvo').value);
    var atual = parseMoney(document.getElementById('field-atual').value) || 0;
    var prazo = document.getElementById('field-prazo').value || null;
    var errEl = document.getElementById('err-alvo');
    if (!titulo || !alvo || alvo <= 0 || isNaN(alvo)){
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    var goal;
    if (editingId){
      var existing = state.goals.find(function(g){return g.id===editingId;}) || {};
      goal = Object.assign({}, existing, { id:editingId, titulo:titulo, alvo:alvo, atual:atual, prazo:prazo });
    } else {
      goal = { id: genId(), titulo:titulo, alvo:alvo, atual:atual, prazo:prazo, criadoEm: Date.now() };
    }
    state.ui.modal = null;
    showToast(editingId ? 'Meta atualizada' : 'Meta criada');
    render();
    upsertGoalDoc(goal);
  }

  function deleteGoal(id){
    showToast('Meta excluída');
    render();
    deleteGoalDoc(id);
  }

  function openAddAporte(goalId){ state.ui.modal = { type:'aporte', goalId:goalId }; render(); }

  function saveAporte(goalId){
    var valor = parseMoney(document.getElementById('field-aporte').value);
    var errEl = document.getElementById('err-aporte');
    if (!valor || valor <= 0 || isNaN(valor)){ errEl.style.display = 'block'; return; }
    errEl.style.display = 'none';
    var quem = document.getElementById('field-aporte-quem').value;
    var goal = state.goals.find(function(g){return g.id===goalId;});
    if (!goal) return;
    var updatedGoal = Object.assign({}, goal, { atual: goal.atual + valor });
    var tx = { id: genId(), tipo:'despesa', valor:valor, categoria:'poupanca', data: todayISO(), quem:quem, descricao:'Aporte: ' + goal.titulo, criadoEm: Date.now(), goalId: goalId, divisao:'individual' };
    state.ui.modal = null;
    showToast('Aporte registrado');
    render();
    upsertGoalDoc(updatedGoal);
    upsertTransactionDoc(tx);
  }

  function updateBudget(catId, rawVal){
    var v = parseMoney(rawVal);
    if (!rawVal || isNaN(v) || v <= 0){ delete state.budgets[catId]; } else { state.budgets[catId] = v; }
    render();
    saveHouseholdMeta();
  }

  function saveSettingsFromForm(){
    var nome1 = document.getElementById('set-nome-1').value.trim() || 'Pessoa 1';
    var nome2 = document.getElementById('set-nome-2').value.trim() || 'Pessoa 2';
    var split1Raw = parseFloat(document.getElementById('set-split1').value);
    var split1 = isNaN(split1Raw) ? 50 : Math.max(0, Math.min(100, split1Raw));
    var split2 = 100 - split1;
    state.settings = { nome1:nome1, nome2:nome2, split1:split1, split2:split2 };
    showToast('Nomes e divisão salvos');
    render();
    saveHouseholdMeta();
  }

  function exportJSON(){
    var data = { settings: state.settings, transactions: state.transactions, budgets: state.budgets, goals: state.goals, exportadoEm: new Date().toISOString() };
    downloadBlob(JSON.stringify(data, null, 2), 'livro-caixa-a-dois.json', 'application/json');
  }
  function exportCSV(){
    var rows = [['data','tipo','categoria','valor','quem','descricao']];
    state.transactions.slice().sort(function(a,b){return a.data.localeCompare(b.data);}).forEach(function(t){
      rows.push([t.data, t.tipo, catById(t.categoria,t.tipo).label, String(t.valor).replace('.',','), t.quem, (t.descricao||'').replace(/[\r\n,]/g,' ')]);
    });
    var csv = rows.map(function(r){ return r.map(function(f){ return '"'+String(f).replace(/"/g,'""')+'"'; }).join(';'); }).join('\n');
    downloadBlob('\uFEFF' + csv, 'lancamentos-livro-caixa.csv', 'text/csv;charset=utf-8');
  }
  function copyToClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    } catch(e){}
  }

  function downloadBlob(content, filename, mime){
    var blob = new Blob([content], {type:mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function importJSON(){
    var input = document.getElementById('import-file');
    if (!input || !input.files || !input.files[0]){ showToast('Escolha um arquivo .json primeiro'); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = JSON.parse(e.target.result);
        var jobs = [];
        if (data.settings){ state.settings = data.settings; jobs.push(saveHouseholdMeta()); }
        if (Array.isArray(data.transactions)) jobs.push(replaceAllTransactions(data.transactions));
        if (data.budgets){ state.budgets = data.budgets; jobs.push(saveHouseholdMeta()); }
        if (Array.isArray(data.goals)) jobs.push(replaceAllGoals(data.goals));
        Promise.all(jobs).then(function(){ showToast('Dados importados'); render(); });
      } catch(err){
        showToast('Arquivo inválido. Exporte um .json deste mesmo painel.');
      }
    };
    reader.readAsText(input.files[0]);
  }

  function resetAllData(){
    Promise.all([ deleteAllInCollection('transactions'), deleteAllInCollection('goals') ]).then(function(){
      state.budgets = {};
      return saveHouseholdMeta();
    }).then(function(){
      showToast('Todos os dados foram apagados');
      render();
    });
  }

  /* ================= EVENTS (delegation) ================= */
  document.addEventListener('click', function(e){
    var overlay = e.target.closest('.overlay');
    if (overlay && e.target === overlay){
      var action = overlay.getAttribute('data-action');
      if (action === 'overlay-close'){ state.ui.modal = null; render(); return; }
      if (action === 'cancel-confirm'){ state.ui.confirm = null; render(); return; }
    }

    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');

    switch(action){
      case 'generate-code':
        var codeInput = document.getElementById('ob-household');
        if (codeInput) codeInput.value = genHouseholdCode();
        break;
      case 'connect-cloud':
        var cfgRaw = (document.getElementById('ob-config').value || '').trim();
        var hid = (document.getElementById('ob-household').value || '').trim().toUpperCase();
        var cfgObj = parseFlexibleConfig(cfgRaw);
        if (!cfgObj){
          state.cloud.error = 'Não consegui ler essa configuração. Cole o trecho que o Firebase mostrou (pode colar o bloco inteiro, com import e comentários — não precisa limpar nada).';
          render();
          break;
        }
        if (!cfgObj.apiKey || !cfgObj.projectId){
          state.cloud.error = 'Faltam campos na configuração. Cole o trecho completo (com apiKey, projectId, appId...).';
          render();
          break;
        }
        if (!hid){
          state.cloud.error = 'Informe ou gere um código da casa.';
          render();
          break;
        }
        connectCloud(cfgObj, hid);
        break;
      case 'set-pessoa':
        state.ui.pessoaSel = parseInt(btn.getAttribute('data-pessoa'), 10);
        render();
        break;
      case 'set-tab':
        state.ui.tab = btn.getAttribute('data-tab');
        render();
        break;
      case 'prev-month':
        state.ui.month--; if (state.ui.month<0){ state.ui.month=11; state.ui.year--; }
        render();
        break;
      case 'next-month':
        state.ui.month++; if (state.ui.month>11){ state.ui.month=0; state.ui.year++; }
        render();
        break;
      case 'refresh':
        if (state.cloud.connected) showToast('Conectado — as mudanças chegam automaticamente.');
        else if (state.cloud.connecting) showToast('Conectando…');
        else showToast(state.cloud.error || 'Sem conexão com a nuvem.');
        break;
      case 'open-add-transaction':
        openAddTransaction();
        break;
      case 'edit-transaction':
        state.ui.modal = { type:'transaction', editingId: btn.getAttribute('data-id') };
        render();
        break;
      case 'delete-transaction':
        deleteTransaction(btn.getAttribute('data-id'));
        break;
      case 'modal-set-tipo':
        state.ui.modal.tipo = btn.getAttribute('data-tipo');
        state.ui.modal.categoria = null;
        state.ui.modal.valor = document.getElementById('field-valor') ? document.getElementById('field-valor').value : state.ui.modal.valor;
        state.ui.modal.data = document.getElementById('field-data') ? document.getElementById('field-data').value : state.ui.modal.data;
        state.ui.modal.quem = document.getElementById('field-quem') ? document.getElementById('field-quem').value : state.ui.modal.quem;
        state.ui.modal.descricao = document.getElementById('field-descricao') ? document.getElementById('field-descricao').value : state.ui.modal.descricao;
        render();
        break;
      case 'modal-set-divisao':
        state.ui.modal.divisao = btn.getAttribute('data-divisao');
        state.ui.modal.valor = document.getElementById('field-valor') ? document.getElementById('field-valor').value : state.ui.modal.valor;
        state.ui.modal.categoria = document.getElementById('field-categoria') ? document.getElementById('field-categoria').value : state.ui.modal.categoria;
        state.ui.modal.data = document.getElementById('field-data') ? document.getElementById('field-data').value : state.ui.modal.data;
        state.ui.modal.quem = document.getElementById('field-quem') ? document.getElementById('field-quem').value : state.ui.modal.quem;
        state.ui.modal.descricao = document.getElementById('field-descricao') ? document.getElementById('field-descricao').value : state.ui.modal.descricao;
        render();
        break;
      case 'save-transaction':
        saveTransactionFromModal(btn.getAttribute('data-editing') || null);
        break;
      case 'close-modal':
        closeModal();
        break;
      case 'open-add-goal':
        openAddGoal();
        break;
      case 'edit-goal':
        openEditGoal(btn.getAttribute('data-id'));
        break;
      case 'save-goal':
        saveGoalFromModal(btn.getAttribute('data-editing') || null);
        break;
      case 'confirm-delete-goal':
        state.ui.confirm = { message:'Excluir esta meta? Os aportes já registrados continuam no histórico de lançamentos.', action:'delete-goal', payload: btn.getAttribute('data-id') };
        render();
        break;
      case 'open-add-aporte':
        openAddAporte(btn.getAttribute('data-id'));
        break;
      case 'save-aporte':
        saveAporte(btn.getAttribute('data-id'));
        break;
      case 'save-settings':
        saveSettingsFromForm();
        break;
      case 'export-json':
        exportJSON();
        break;
      case 'export-csv':
        exportCSV();
        break;
      case 'import-json':
        importJSON();
        break;
      case 'confirm-reset':
        state.ui.confirm = { message:'Apagar todos os lançamentos, orçamentos e metas? Essa ação não pode ser desfeita.', action:'reset-all' };
        render();
        break;
      case 'copy-household-code':
        copyToClipboard(cloud.householdId || '');
        showToast('Código copiado');
        break;
      case 'confirm-disconnect':
        state.ui.confirm = { message:'Desconectar este aparelho? Você vai precisar colar a configuração e o código da casa de novo para reconectar.', action:'disconnect' };
        render();
        break;
      case 'cancel-confirm':
        state.ui.confirm = null;
        render();
        break;
      case 'run-confirm':
        var c = state.ui.confirm;
        state.ui.confirm = null;
        if (!c) break;
        if (c.action === 'delete-goal') deleteGoal(c.payload);
        else if (c.action === 'reset-all') resetAllData();
        else if (c.action === 'disconnect') disconnectCloud();
        break;
    }
  });

  document.addEventListener('change', function(e){
    if (e.target.matches('[data-filter]')){
      state.ui.filters[e.target.getAttribute('data-filter')] = e.target.value;
      render();
    }
    if (e.target.matches('[data-budget-cat]')){
      updateBudget(e.target.getAttribute('data-budget-cat'), e.target.value);
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && (state.ui.modal || state.ui.confirm)){
      state.ui.modal = null; state.ui.confirm = null; render();
    }
  });

  /* ================= INIT ================= */
  render();
  var savedSetup = getLocalCloudSetup();
  if (savedSetup){
    connectCloud(savedSetup.config, savedSetup.householdId);
  }
  setTimeout(function(){
    if (typeof Chart === 'undefined'){
      showToast('Os gráficos não carregaram. Verifique sua internet e recarregue a página.');
    }
  }, 4000);

})();
</script>
</body>
</html>
